# Aus dieser Datei baut kalender/ifen.py die Datei kalender/out/ifen.ics.
# Nach jedem Push baut GitHub die .ics automatisch neu, abonnierte
# Kalender holen sich die Änderung von selbst.
#
# Felder pro Termin:
#   titel:   Pflicht. Was im Kalender steht.
#   datum:   Pflicht. JJJJ-MM-TT
#   beginn:  HH:MM (weglassen = ganztägig)
#   ende:    HH:MM
#   ort:     optional
#   kurs:    optional, IFEN-Kursnummer
#   notiz:   optional, landet in der Beschreibung
#   status:  bestaetigt | vorschlag | offen   (Standard: bestaetigt)
#            "vorschlag" und "offen" werden im Kalender als vorläufig markiert
#            und bekommen ein "?" vor den Titel.
#
# Zeitzone für alle Termine: Europe/Luxembourg

