<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131D19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernwerkstatt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lernwerkstatt · Deutsch, Französisch &amp; Mathe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* Papier mit Grünstich - das Material der Lernwerkstatt, kein neutrales Grau */
    --paper:#EDF0E8; --raised:#FFFFFF; --sunk:#F5F8F2;
    --ink:#1C2823; --soft:#54655A; --line:#D4DCCF;
    --accent:#2C7053; --accent-ink:#FFFFFF;
    --blue:#2A6480; --clay:#AE5527; --gold:#A9701A;
    --ring:#C9832E;
    --shadow:0 1px 2px rgba(28,40,35,.06), 0 8px 20px -14px rgba(28,40,35,.35);
    --shadow-lift:0 2px 4px rgba(28,40,35,.07), 0 16px 32px -18px rgba(28,40,35,.4);
    --r-s:.6rem; --r-m:.9rem; --r-l:1.25rem;
    --scale:1; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131D19; --raised:#1C2823; --sunk:#172119;
      --ink:#E3ECE6; --soft:#A2B6A9; --line:#29372F;
      --accent:#57B48A; --accent-ink:#0B1611;
      --blue:#6DB2D2; --clay:#DE8F5C; --gold:#DFA857;
      --ring:#E3A857;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
      --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 18px 36px -18px rgba(0,0,0,.75);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#131D19; --raised:#1C2823; --sunk:#172119;
    --ink:#E3ECE6; --soft:#A2B6A9; --line:#29372F;
    --accent:#57B48A; --accent-ink:#0B1611;
    --blue:#6DB2D2; --clay:#DE8F5C; --gold:#DFA857;
    --ring:#E3A857;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 18px 36px -18px rgba(0,0,0,.75);
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html{ font-size:calc(17px * var(--scale)); -webkit-text-size-adjust:100%; }

  /* Verdana trägt jeden Lesetext: weite Laufweite, klar unterscheidbare
     Buchstaben - die übliche Empfehlung bei Lese-Rechtschreib-Schwäche.
     Lexend, entworfen für flüssigeres Lesen, führt Titel und Bedienung. */
  body{
    margin:0; background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:Verdana,"DejaVu Sans",Geneva,sans-serif;
    font-size:1rem; line-height:1.7; letter-spacing:.012em;
    -webkit-font-smoothing:antialiased;
  }
  .util,h1,h2,h3,.btn,.stat b,.stat span,.colhead,.tag,th,.prof,.miclab,.badge .nm,.badge .st{
    font-family:Lexend,"Segoe UI",system-ui,-apple-system,sans-serif;
  }

  .shell{ max-width:42rem; margin:0 auto; padding:1rem 1.1rem 3.5rem;
    display:flex; flex-direction:column; gap:1.1rem; }

  /* ---------- Kopfzeile ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:.5rem; font-weight:600; font-size:1.05rem;
    font-family:Lexend,"Segoe UI",system-ui,sans-serif; letter-spacing:-.01em; }
  .controls{ display:flex; gap:.4rem; }
  .iconbtn{ border:1px solid var(--line); background:var(--raised); color:var(--ink);
    border-radius:var(--r-s); min-width:2.75rem; height:2.75rem; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-family:inherit; font-size:.95rem;
    transition:border-color .15s, background .15s; }
  .iconbtn:hover{ border-color:var(--accent); background:var(--sunk); }
  :focus-visible{ outline:3px solid var(--ring); outline-offset:2px; border-radius:4px; }

  /* ---------- Wegstrecke ---------- */
  .path{ display:flex; align-items:center; gap:.1rem; overflow-x:auto; padding:.35rem .1rem;
    scrollbar-width:none; }
  .path::-webkit-scrollbar{ display:none; }
  .node{ flex:none; width:2.1rem; height:2.1rem; border-radius:50%; background:var(--raised);
    border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:.9rem; transition:transform .2s; }
  .node.done{ background:var(--accent); border-color:var(--accent); }
  .node.cur{ border-color:var(--ring); box-shadow:0 0 0 4px color-mix(in srgb,var(--ring) 22%,transparent);
    transform:scale(1.12); font-weight:700; }
  .track{ flex:1; height:3px; background:var(--line); min-width:.4rem; border-radius:2px; }
  .track.done{ background:var(--accent); }

  /* ---------- Karte ---------- */
  .card{ background:var(--raised); border:1px solid var(--line); border-radius:var(--r-l);
    box-shadow:var(--shadow); padding:1.5rem 1.35rem; display:flex; flex-direction:column; gap:1.1rem; }

  h1{ font-size:1.5rem; line-height:1.3; margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.015em; }
  h2{ font-size:1.2rem; line-height:1.35; margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em; }
  h3{ font-size:.95rem; margin:0; font-weight:600; letter-spacing:-.005em; }
  .lead{ color:var(--soft); margin:0; }
  .hint{ font-size:.88rem; line-height:1.6; color:var(--soft); margin:0; }

  /* ---------- Kinder ---------- */
  .profrow{ display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; }
  .prof{ font-family:Lexend,"Segoe UI",system-ui,sans-serif; font-size:.92rem; font-weight:500;
    padding:.45rem .85rem; min-height:2.4rem; border-radius:999px; cursor:pointer;
    border:1.5px solid var(--line); background:var(--sunk); color:var(--soft);
    transition:border-color .15s, color .15s, background .15s; }
  .prof:hover{ border-color:var(--accent); color:var(--ink); }
  .prof.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .prof.add{ font-size:1.15rem; line-height:1; padding:.45rem .8rem; color:var(--accent); }
  .newprof{ display:flex; flex-direction:column; gap:.6rem;
    padding:.9rem; border:1.5px dashed var(--line); border-radius:var(--r-m); background:var(--sunk); }

  /* ---------- Aufgaben ---------- */
  .tag{ display:flex; align-items:center; gap:.45rem; flex-wrap:wrap;
    font-size:.82rem; font-weight:600; letter-spacing:.005em; color:var(--soft); }
  .tag.t-de{ color:var(--accent); }
  .tag.t-fr{ color:var(--blue); }
  .tag.t-ma{ color:var(--clay); }
  .prompt{ font-size:1.3rem; font-weight:700; line-height:1.55; text-wrap:balance; }
  .passage{ font-size:1.12rem; line-height:1.9; background:var(--sunk);
    border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:var(--r-m); padding:1rem 1.1rem; }

  .opts{ display:flex; flex-direction:column; gap:.55rem; }
  .opt{ font-family:inherit; font-size:1.05rem; text-align:left; padding:.85rem 1rem;
    border-radius:var(--r-m); border:2px solid var(--line); background:var(--sunk); color:var(--ink);
    cursor:pointer; min-height:3rem; display:flex; justify-content:space-between; align-items:center;
    gap:.5rem; transition:border-color .15s, background .15s; }
  .opt:hover:not(:disabled){ border-color:var(--accent); background:var(--raised); }
  .opt.ok{ background:color-mix(in srgb,var(--accent) 14%,var(--raised)); border-color:var(--accent); }
  .opt.no{ background:color-mix(in srgb,var(--clay) 14%,var(--raised)); border-color:var(--clay); }

  .row{ display:flex; gap:.55rem; flex-wrap:wrap; align-items:center; }
  .sp{ flex:1; }
  .btn{ font-size:.98rem; font-weight:600; padding:.75rem 1.2rem; min-height:2.9rem;
    border-radius:var(--r-m); border:none; cursor:pointer; letter-spacing:-.005em;
    transition:filter .15s, border-color .15s; }
  .btn:hover:not(:disabled){ filter:brightness(1.06); }
  .p{ background:var(--accent); color:var(--accent-ink); }
  .g{ background:transparent; color:var(--soft); border:1.5px solid var(--line); }
  .g:hover:not(:disabled){ border-color:var(--accent); color:var(--ink); }
  .btn:disabled{ opacity:.45; cursor:default; filter:none; }

  .fb{ display:flex; align-items:center; gap:.5rem; font-weight:600; border-radius:var(--r-m);
    padding:.7rem 1rem; font-family:Lexend,"Segoe UI",system-ui,sans-serif; }
  .fb.ok{ background:color-mix(in srgb,var(--accent) 15%,transparent); color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); }
  .fb.no{ background:color-mix(in srgb,var(--clay) 15%,transparent); color:var(--clay);
    border:1px solid color-mix(in srgb,var(--clay) 35%,transparent); }

  /* ---------- Sprechen ---------- */
  .mic{ display:flex; flex-direction:column; align-items:center; gap:.6rem; }
  .micbtn{ width:4.8rem; height:4.8rem; border-radius:50%; border:none; background:var(--accent);
    color:var(--accent-ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent); }
  .micbtn svg{ width:2.1rem; height:2.1rem; }
  .micbtn.on{ animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent);} 50%{ box-shadow:0 0 0 16px transparent;} }
  .miclab{ font-size:.9rem; color:var(--soft); text-align:center; }
  .micmsg{ max-width:26rem; }
  .link{ background:none; border:none; color:var(--soft); text-decoration:underline;
    text-underline-offset:3px; font-family:inherit; cursor:pointer; font-size:.9rem;
    padding:.4rem .2rem; min-height:2.2rem; }
  .link:hover{ color:var(--ink); }
  .inrow{ display:flex; gap:.5rem; width:100%; }
  .inrow input,.newprof input{ flex:1; font-family:inherit; font-size:1.1rem; padding:.7rem .85rem;
    border-radius:var(--r-s); border:2px solid var(--line); background:var(--sunk); color:var(--ink);
    min-width:0; min-height:2.9rem; }
  .inrow input:focus,.newprof input:focus{ border-color:var(--accent); }

  /* ---------- Bausteine ---------- */
  .chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .chip{ font-family:inherit; font-size:1.02rem; padding:.6rem .9rem; min-height:2.8rem;
    border-radius:var(--r-s); border:2px solid var(--line); background:var(--sunk); color:var(--ink);
    cursor:pointer; transition:border-color .15s; }
  .chip:hover:not(:disabled){ border-color:var(--accent); }
  .chip:disabled{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); cursor:default; }
  .slot{ min-height:3rem; background:var(--sunk); border:2px dashed var(--line);
    border-radius:var(--r-m); padding:.6rem .8rem; display:flex; flex-wrap:wrap; gap:.4rem;
    align-items:center; font-weight:700; }

  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  .colhead{ font-size:.8rem; color:var(--soft); letter-spacing:.005em;
    text-align:center; font-weight:600; margin-bottom:.4rem; }
  .mitem{ font-family:inherit; font-size:.98rem; padding:.7rem .8rem; min-height:2.9rem;
    border-radius:var(--r-s); border:2px solid var(--line); background:var(--sunk); color:var(--ink);
    cursor:pointer; text-align:left; transition:border-color .15s; }
  .mitem:hover:not(:disabled){ border-color:var(--accent); }
  .mitem.sel{ border-color:var(--ring); box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent); }
  .mitem:disabled{ opacity:.4; cursor:default; }

  .sortbtns{ display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  .sortb{ font-family:Lexend,"Segoe UI",system-ui,sans-serif; font-weight:600; font-size:1.05rem;
    padding:1.2rem .8rem; border-radius:var(--r-m); border:2px solid var(--line);
    background:var(--sunk); color:var(--ink); cursor:pointer; transition:border-color .15s, background .15s; }
  .sortb:hover{ border-color:var(--accent); background:var(--raised); }
  .trace{ display:flex; flex-wrap:wrap; gap:.35rem; font-size:.82rem; }
  .tr{ padding:.2rem .6rem; border-radius:999px; background:var(--sunk); border:1px solid var(--line); }
  .tr.ok{ border-color:var(--accent); color:var(--accent); }
  .tr.no{ border-color:var(--clay); color:var(--clay); }

  /* ---------- Sammlung ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr)); gap:.7rem; }
  .badge{ border-radius:var(--r-m); padding:1rem .6rem; text-align:center; border:1.5px solid var(--line);
    background:var(--sunk); display:flex; flex-direction:column; gap:.35rem; align-items:center; }
  .badge.have{ border-color:var(--gold);
    background:linear-gradient(165deg,color-mix(in srgb,var(--gold) 16%,var(--raised)),var(--raised)); }
  .badge .em{ font-size:2.1rem; line-height:1; filter:grayscale(1); opacity:.3; }
  .badge.have .em{ filter:none; opacity:1; }
  .badge .nm{ font-size:.78rem; font-weight:600; line-height:1.3; }
  .badge .st{ font-size:.72rem; color:var(--soft); }

  .statrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; }
  .stat{ background:var(--sunk); border:1px solid var(--line); border-radius:var(--r-m);
    padding:.85rem .5rem; text-align:center; }
  .stat b{ display:block; font-size:1.55rem; line-height:1.2; font-weight:600;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .stat span{ font-size:.72rem; color:var(--soft); line-height:1.35; display:block; margin-top:.15rem; }

  .bar{ height:.65rem; background:var(--sunk); border:1px solid var(--line);
    border-radius:999px; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--accent); border-radius:999px;
    transition:width .5s ease; }

  /* ---------- Bericht ---------- */
  table{ width:100%; border-collapse:collapse; font-size:.86rem;
    font-family:Lexend,"Segoe UI",system-ui,sans-serif; }
  th,td{ text-align:left; padding:.55rem .45rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ font-size:.76rem; letter-spacing:.005em; color:var(--soft); font-weight:600; }
  tbody tr:last-child td{ border-bottom:none; }
  .tw{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }

  textarea{ width:100%; min-height:7rem; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.78rem; line-height:1.5; border:1.5px solid var(--line); border-radius:var(--r-s);
    padding:.7rem; background:var(--sunk); color:var(--ink); }

  .kudos{ text-align:center; padding:.8rem; border-radius:var(--r-m); font-weight:600;
    font-family:Lexend,"Segoe UI",system-ui,sans-serif;
    background:linear-gradient(165deg,color-mix(in srgb,var(--gold) 20%,transparent),transparent);
    border:1px solid color-mix(in srgb,var(--gold) 30%,transparent); }
  .stars{ font-size:1.9rem; text-align:center; letter-spacing:.1em; }
  .subj{ display:inline-flex; align-items:center; gap:.3rem; font-size:.76rem; padding:.2rem .6rem;
    border-radius:999px; background:var(--sunk); border:1px solid var(--line); }

  /* ---------- Profilbild ---------- */
  .av{ flex:none; width:1.5rem; height:1.5rem; border-radius:50%; display:inline-flex;
    align-items:center; justify-content:center; background-size:cover; background-position:center;
    background-color:var(--sunk); font-size:.95rem; line-height:1; overflow:hidden; }
  .av.big{ width:3.4rem; height:3.4rem; font-size:2rem; border:2px solid var(--line); }
  .prof .av{ margin-right:.1rem; }
  .hello{ display:flex; align-items:center; gap:.8rem; }
  .hello h1{ flex:1; }
  .avpick{ display:flex; gap:.9rem; align-items:flex-start; padding:.9rem;
    border:1px solid var(--line); border-radius:var(--r-m); background:var(--sunk); }
  .avopts{ flex:1; display:flex; flex-direction:column; gap:.6rem; min-width:0; }
  .emorow{ display:flex; flex-wrap:wrap; gap:.35rem; }
  .emo-b{ width:2.6rem; height:2.6rem; font-size:1.3rem; line-height:1; cursor:pointer;
    border-radius:var(--r-s); border:1.5px solid var(--line); background:var(--raised);
    display:flex; align-items:center; justify-content:center; transition:border-color .15s; }
  .emo-b:hover{ border-color:var(--accent); }
  .emo-b.on{ border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent); }

  /* ---------- Startseite: Aktionen ---------- */
  .acts{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .act{ display:flex; flex-direction:column; align-items:flex-start; gap:.15rem;
    padding:.85rem .9rem; min-height:5rem; cursor:pointer; text-align:left;
    border:1.5px solid var(--line); border-radius:var(--r-m); background:var(--sunk);
    color:var(--ink); font-family:Lexend,"Segoe UI",system-ui,sans-serif;
    transition:border-color .15s, background .15s; }
  .act:hover{ border-color:var(--accent); background:var(--raised); }
  .act .ai{ font-size:1.35rem; line-height:1.2; }
  .act .an{ font-weight:600; font-size:.95rem; }
  .act .ad{ font-size:.75rem; color:var(--soft); line-height:1.35; }

  /* ---------- Themenwahl ---------- */
  .grp{ display:flex; flex-direction:column; gap:.5rem; }
  .grp h3.t-de{ color:var(--accent); }
  .grp h3.t-fr{ color:var(--blue); }
  .grp h3.t-ma{ color:var(--clay); }
  .topics{ display:flex; flex-direction:column; gap:.4rem; }
  .topic{ display:flex; align-items:center; gap:.7rem; width:100%; text-align:left;
    padding:.7rem .85rem; min-height:3.2rem; cursor:pointer; font-family:inherit;
    border:2px solid var(--line); border-radius:var(--r-m); background:var(--sunk); color:var(--ink);
    transition:border-color .15s, background .15s; }
  .topic:hover{ border-color:var(--accent); background:var(--raised); }
  .topic.on{ border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--raised)); }
  .topic .tic{ flex:none; font-size:1.25rem; line-height:1; }
  .tbody{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .tnm{ font-weight:600; font-size:.98rem; line-height:1.35;
    font-family:Lexend,"Segoe UI",system-ui,sans-serif; }
  .tmeta{ font-size:.78rem; color:var(--soft); line-height:1.4; }
  .topic .tck{ flex:none; width:1.5rem; text-align:center; color:var(--accent); font-weight:700; }

  /* ---------- Blitzrunde ---------- */
  .blitzcard{ gap:.85rem; }
  .bzhead{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    font-family:Lexend,"Segoe UI",system-ui,sans-serif; }
  .bztag{ font-weight:600; color:var(--gold); }
  .bzscore{ flex:1; font-size:.88rem; color:var(--soft); }
  .bztime{ font-weight:700; font-variant-numeric:tabular-nums; font-size:1.05rem; }
  .bzbar{ height:.5rem; background:var(--sunk); border:1px solid var(--line);
    border-radius:999px; overflow:hidden; }
  .bzbar i{ display:block; height:100%; background:var(--gold); border-radius:999px; }

  @media (max-width:30rem){
    .acts{ grid-template-columns:1fr 1fr; }
    .act{ min-height:4.6rem; padding:.7rem .75rem; }
    .avpick{ flex-direction:column; align-items:center; }
    .avopts{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .node.cur{ transform:none; }
  }

  @media print{
    body{ background:#fff; color:#000; }
    .noprint{ display:none !important; }
    .card{ box-shadow:none; border:1px solid #ccc; }
    .shell{ max-width:none; padding:0; }
  }
  @media (max-width:30rem){
    h1{ font-size:1.28rem; } .prompt{ font-size:1.12rem; }
    .cols{ grid-template-columns:1fr; }
    .card{ padding:1.2rem 1rem; }
    .stat b{ font-size:1.35rem; }
  }
</style>

</head>
<body>
<div class="shell">
  <div class="topbar noprint">
    <div class="brand">🎒 <span>Lernwerkstatt</span></div>
    <div class="controls">
      <button class="iconbtn util" id="bMinus" title="Schrift kleiner">A−</button>
      <button class="iconbtn util" id="bPlus" title="Schrift größer">A+</button>
      <button class="iconbtn" id="bSound" title="Vorlesen an/aus">🔊</button>
      <button class="iconbtn" id="bTheme" title="Hell/Dunkel">◐</button>
    </div>
  </div>
  <div class="path noprint" id="path"></div>
  <main id="app"></main>
  <footer class="hint noprint" style="text-align:center">Diktieren braucht Chrome, Edge oder Safari <b>und</b> die Mikrofon-Erlaubnis. Im eingebetteten Fenster ist das Mikrofon gesperrt – dort hilft nur „In neuem Tab öffnen" bzw. die eigenständige Fassung. Tippen geht überall.</footer>
</div>

    if((''+a).indexOf('data:')===0)
      return '<span class="av '+(cls||'')+'" style="background-image:url('+esc(a)+')" role="img" aria-label="Bild von '+esc(nm)+'"></span>';
    return '<span class="av '+(cls||'')+' emo" role="img" aria-label="Bild von '+esc(nm)+'">'+esc(a)+'</span>';
  }

  function initStore(){
    var st=load(K_ROOT,null);
    if(st && st.profiles && typeof st.profiles==='object' && Object.keys(st.profiles).length){
      if(!st.active || !st.profiles[st.active]) st.active=Object.keys(st.profiles)[0];
      return st;
    }
    st={ active:'Sam', profiles:{ Sam:samSeed() } };
    /* Auf einem Gerät, das die Vorgängerfassung genutzt hat, steht oft
       mehr als im Seed - das wird dazugemischt, nie überschrieben. */
    var oProg=load(K_PROG,null), oMeta=load(K_META,null), oLog=load(K_LOG,null);
    if(oProg||oMeta||oLog){
      var nm=(oMeta&&oMeta.name&&(''+oMeta.name).trim())||'Sam';
      if(!st.profiles[nm]) st.profiles[nm]=blankProfile(nm);
      mergeData(st.profiles[nm], {prog:oProg||{}, meta:oMeta||{}, log:oLog||[]});
      st.profiles[nm].meta.name=nm;
      st.active=nm;
    }
    return st;
  }

  /* Zusammenführen statt überschreiben - überall dieselbe Regel:
     der jeweils bessere Wert gewinnt. */
  function mergeData(dst,rem){
    if(!rem||typeof rem!=='object') return;
    dst.prog=dst.prog||{}; dst.meta=dst.meta||{}; dst.log=dst.log||[];
    var rp=rem.prog||{};
    Object.keys(rp).forEach(function(id){
      var b=rp[id]; if(!b||typeof b!=='object') return;
      var a=dst.prog[id];
      if(!a){ dst.prog[id]=b; return; }
      dst.prog[id]={ level:Math.max(a.level|0,b.level|0), stars:Math.max(a.stars|0,b.stars|0),
        done:Math.max(a.done|0,b.done|0), correct:Math.max(a.correct|0,b.correct|0),
        last:((a.last||'')>(b.last||''))?a.last:b.last };
    });
    var rm=rem.meta||{};
    dst.meta.xp=Math.max(dst.meta.xp|0, rm.xp|0);
    dst.meta.streak=Math.max(dst.meta.streak|0, rm.streak|0);
    if((rm.lastDay||'')>(dst.meta.lastDay||'')) dst.meta.lastDay=rm.lastDay;
    if(!dst.meta.name && rm.name) dst.meta.name=rm.name;
    if(!dst.meta.avatar && rm.avatar) dst.meta.avatar=rm.avatar;
    if(Array.isArray(rem.log)){
      var seen={}, out=[];
      dst.log.concat(rem.log).forEach(function(L){
        if(!L||!L.d) return;
        var k=L.d+'|'+L.w+'|'+L.r+'|'+L.c+'|'+L.t;
        if(seen[k]) return; seen[k]=1; out.push(L);
      });
      out.sort(function(x,y){ return (x.d<y.d)?-1:((x.d>y.d)?1:0); });
      dst.log=out.slice(-200);
    }
  }

  var store=initStore();
  var prog, log, meta;

  function profileNames(){ return Object.keys(store.profiles); }
  function useProfile(name){
    name=(''+name).trim(); if(!name) return;
    if(!store.profiles[name]) store.profiles[name]=blankProfile(name);
    store.active=name;
    var p=store.profiles[name];
    p.prog=p.prog||{}; p.log=p.log||[]; p.meta=p.meta||{};
    if(p.meta.xp==null) p.meta.xp=0;
    if(p.meta.streak==null) p.meta.streak=0;
    if(p.meta.lastDay===undefined) p.meta.lastDay=null;
    if(!p.meta.avatar) p.meta.avatar=AVATARS[Math.floor(Math.random()*AVATARS.length)];
    p.meta.name=name;
    prog=p.prog; log=p.log; meta=p.meta;
    persist();
  }
  function renameProfile(from,to){
    to=(''+to).trim();
    if(!to || !store.profiles[from]) return 'Der Name darf nicht leer sein.';
    if(to!==from && store.profiles[to]) return 'Diesen Namen gibt es schon.';
    if(to===from) return null;
    store.profiles[to]=store.profiles[from];
    delete store.profiles[from];
    store.profiles[to].meta.name=to;
    if(store.active===from) store.active=to;
    useProfile(store.active);
    return null;
  }
  function deleteProfile(name){
    if(!store.profiles[name]) return;
    delete store.profiles[name];
    if(!profileNames().length) store.profiles['Sam']=blankProfile('Sam');
    useProfile(store.active===name?profileNames()[0]:store.active);
  }
  useProfile(store.active);

  /* ---- Geräteübergreifender Lernstand -------------------------------
     Die veröffentlichte Seite darf sich eigene Datendateien schreiben.
     Der Lernstand liegt damit neben der Seite statt nur im Browser, und
     jedes Gerät liest beim Start dieselbe Datei. Ohne diese Fähigkeit
     (eigene Datei, fremdes Hosting, Nur-Lese-Ansicht) bleibt alles wie
     vorher lokal - die App funktioniert unverändert weiter. */
  var DATA_PATH='data/lernstand.json';
  var CLOUD={ ns:null, on:false, state:'lokal', busy:false };

  function cloudInit(done){
    if(!(window.claude && typeof window.claude.use==='function')){ done(); return; }
    var fin=false, t=setTimeout(function(){ if(!fin){ fin=true; done(); } },6000);
    function end(){ if(fin) return; fin=true; clearTimeout(t); done(); }
    try{
      window.claude.use('artifact').then(function(ns){
        if(!ns||typeof ns.publish!=='function'){ end(); return; }
        CLOUD.ns=ns; CLOUD.on=true; CLOUD.state='geladen';
        fetch(DATA_PATH,{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; })
          .then(function(remote){ if(remote) mergeIn(remote); end(); })
          ['catch'](function(){ end(); });
      })['catch'](function(){ end(); });
    }catch(e){ end(); }
  }

  /* Eingehende Daten in das gerade aktive Profil mischen. Kennt beide
     Formate: das Bündel mit allen Profilen und den Einzelstand. */
  function mergeIn(rem){
    if(!rem||typeof rem!=='object') return;
    if(rem.profiles && typeof rem.profiles==='object'){
      Object.keys(rem.profiles).forEach(function(nm){
        if(!store.profiles[nm]) store.profiles[nm]=blankProfile(nm);
        mergeData(store.profiles[nm], rem.profiles[nm]);
        store.profiles[nm].meta.name=nm;
      });
      useProfile(store.active);
      return;
    }
    var p=store.profiles[store.active];
    mergeData(p, rem);
    prog=p.prog; log=p.log; meta=p.meta; meta.name=store.active;
    persist();
  }

  /* ---- Lernstand von Hand übertragen ----------------------------
     Ohne die Artefakt-Laufzeit (eigenständig gehostet) gibt es keinen
     gemeinsamen Speicher. Damit ein Kind trotzdem am iPad weitermachen
     kann, wo es am Laptop aufgehört hat, lässt sich der Stand als Datei
     oder als Textcode mitnehmen. Leere Themen fliegen raus - sonst wird
     der Code unnötig lang. */
  function slimProfile(p,mitBild){
    var slim={};
    Object.keys(p.prog||{}).forEach(function(id){
      var e=p.prog[id];
      if(e && ((e.level|0)>0 || (e.done|0)>0)) slim[id]=e;
    });
    var m={}, src=p.meta||{};
    Object.keys(src).forEach(function(k){ m[k]=src[k]; });
    /* Fotos blähen den Kopier-Code auf das Hundertfache auf - in der
       Datei bleiben sie, im Text-Code nicht. */
    if(!mitBild && (''+(m.avatar||'')).indexOf('data:')===0) delete m.avatar;
    return { prog:slim, meta:m, log:(p.log||[]).slice(-40) };
  }
  /* nur = Name eines Profils, sonst alle Kinder auf einmal */
  function exportState(nur,mitBild){
    var out={};
    (nur?[nur]:profileNames()).forEach(function(nm){
      if(store.profiles[nm]) out[nm]=slimProfile(store.profiles[nm],mitBild);
    });
    return JSON.stringify({ v:2, savedAt:new Date().toISOString(),
      active:(nur||store.active), profiles:out });
  }
  function importState(txt){
    var data;
    try{ data=JSON.parse((''+txt).trim()); }catch(e){ return 'Das war kein gültiger Lernstand.'; }
    if(!data || typeof data!=='object' || (!data.prog && !data.profiles)) return 'Das war kein gültiger Lernstand.';
    if(data.profiles){
      mergeIn(data);
      if(data.active && store.profiles[data.active]) useProfile(data.active);
    }else{
      /* Einzelstand aus der Vorgängerfassung: nach Namen einsortieren */
      var nm=(data.meta&&data.meta.name&&(''+data.meta.name).trim())||store.active;
      useProfile(nm);
      mergeIn(data);
    }
    rebuildPlan();
    return null;
  }

  function startRun(picks){
    SESSION=picks;
    PLAN=SESSION.map(function(p){
      var def = p.round==='a' ? p.w.a : p.w.b;
      return { world:p.w, round:p.round, review:p.review, def:def, type:def.type };
    });
    touchStreak();
    S.screen='play'; S.stop=0; S.item=0; S.phase='intro'; S.result=null; S.typing=false; S.micMsg=null;
    S.sessionCorrect=0; S.sessionTotal=0; S.roundCorrect=0; S.roundTotal=0; S.gainXP=0; S.doneStops=[];
    S.order={picked:[]}; S.match={sel:null,done:[],wrong:0}; S.sort={i:0,trace:[]};
    render();
  }
  function startTopics(ids){
    if(!ids.length) return;
    startRun(ids.map(function(id){
      var w=WORLDS.filter(function(x){return x.id===id;})[0];
      var lv=levelOf(id);
      return { w:w, round:roundFor(id), review:lv>=2 };
    }));
  }

  function rebuildPlan(){
    SESSION=buildSession();
    PLAN=SESSION.map(function(p){
      var def = p.round==='a' ? p.w.a : p.w.b;
      return { world:p.w, round:p.round, review:p.review, def:def, type:def.type };
    });
  }

  function cloudPayload(){ return exportState(null,true); }

  function cloudSave(cb,retried){
    if(!CLOUD.on||!CLOUD.ns){ cb&&cb('lokal'); return; }
    if(CLOUD.busy){ cb&&cb(CLOUD.state); return; }
    CLOUD.busy=true;
    var files={}; files[DATA_PATH]=cloudPayload();
    CLOUD.ns.publish(files).then(function(){
      CLOUD.busy=false; CLOUD.state='gesichert'; cb&&cb('gesichert');
    })['catch'](function(e){
      CLOUD.busy=false;
      var code=e&&e.code;
      if(code==='conflict' && !retried){
        /* Ein anderes Gerät war schneller: dessen Stand holen, mischen, einmal erneut. */
        fetch(DATA_PATH,{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; })
          .then(function(remote){ if(remote) mergeIn(remote); cloudSave(cb,true); })
          ['catch'](function(){ CLOUD.state='fehler'; cb&&cb('fehler'); });
        return;
      }
      CLOUD.state=(code==='capability_disabled'||code==='not_writer'||code==='not_granted')?'nurlesen':'fehler';
      cb&&cb(CLOUD.state);
    });
  }

  function cloudLabel(){
    if(!CLOUD.on) return 'Fortschritt wird nur auf diesem Gerät gespeichert.';
    if(CLOUD.state==='gesichert') return '☁ Fortschritt gesichert – auf allen deinen Geräten verfügbar.';
    if(CLOUD.state==='nurlesen') return 'Diese Ansicht darf nicht schreiben – der Stand bleibt auf diesem Gerät.';
    if(CLOUD.state==='fehler') return 'Sichern hat gerade nicht geklappt. Dein Stand ist auf diesem Gerät sicher.';
    return '☁ Geräteübergreifender Lernstand ist an.';
  }

  function P(id){ if(!prog[id]) prog[id]={level:0,stars:0,done:0,correct:0,last:null}; return prog[id]; }
  function levelOf(id){ return P(id).level; }
  function earned(){ return WORLDS.filter(function(w){return levelOf(w.id)>=1;}).length; }
  function mastered(){ return WORLDS.filter(function(w){return levelOf(w.id)>=2;}).length; }
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function touchStreak(){
    var t=todayStr();
    if(meta.lastDay===t) return;
    var y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    meta.streak = (meta.lastDay===y) ? (meta.streak||0)+1 : 1;
    meta.lastDay=t; save(K_META,meta);
  }

  /* Fotos werden quadratisch zugeschnitten und auf 160 px verkleinert,
     bevor sie in den Speicher gehen - ein Original aus der Handykamera
     würde den Platz für alle Profile sprengen. */
  function processAvatar(file,cb){
    if(!file){ cb(null,'Keine Datei gewählt.'); return; }
    if(!/^image\//.test(file.type||'')){ cb(null,'Das ist kein Bild.'); return; }
    var fr=new FileReader();
    fr.onerror=function(){ cb(null,'Die Datei konnte nicht gelesen werden.'); };
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){ cb(null,'Dieses Bildformat kann der Browser nicht öffnen.'); };
      img.onload=function(){
        try{
          var SZ=160, c=document.createElement('canvas'); c.width=c.height=SZ;
          var ctx=c.getContext('2d');
          var side=Math.min(img.width,img.height);
          ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,SZ,SZ);
          var out='';
          try{ out=c.toDataURL('image/webp',0.82); }catch(e){}
          if(out.indexOf('data:image/webp')!==0) out=c.toDataURL('image/jpeg',0.82);
          if(out.length>90000) out=c.toDataURL('image/jpeg',0.6);
          if(out.length>90000){ cb(null,'Das Bild ist zu groß. Nimm ein anderes.'); return; }
          cb(out,null);
        }catch(e){ cb(null,'Das Bild konnte nicht verkleinert werden.'); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }

  function setAvatar(nm,val){
    var p=store.profiles[nm]; if(!p) return null;
    var old=p.meta.avatar;
    p.meta.avatar=val;
    if(!persist()){
      p.meta.avatar=old; persist();
      return 'Der Speicher ist voll. Lösche ein Foto oder nimm ein Emoji.';
    }
    return null;
  }

  /* ================= Session ================= */
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;} return a; }

  function buildSession(){
    var TARGET=6, picks=[];
    var bySub={de:[],fr:[],ma:[]};
    WORLDS.forEach(function(w){ bySub[w.subject].push(w); });
    // Reihenfolge: Deutsch, Mathe, Französisch abwechselnd
    var order=['de','ma','fr'], pools={};
    order.forEach(function(s){
      pools[s]=shuffle(bySub[s]).sort(function(x,y){ return levelOf(x.id)-levelOf(y.id); });
    });
    var idx={de:0,ma:0,fr:0}, guard=0;
    while(picks.length<TARGET && guard++<60){
      for(var i=0;i<order.length && picks.length<TARGET;i++){
        var s=order[i], pool=pools[s];
        if(idx[s]<pool.length){
          var w=pool[idx[s]++];
          var lv=levelOf(w.id);
          picks.push({w:w, round: lv===0?'a':(lv===1?'b':(Math.random()<.5?'a':'b')), review: lv>=2});
        }
      }
    }
    return picks;
  }

  var SESSION = buildSession();
  var PLAN = SESSION.map(function(p){
    var def = p.round==='a' ? p.w.a : p.w.b;
    return { world:p.w, round:p.round, review:p.review, def:def, type:def.type };
  });

  /* ---- Gezielt üben ------------------------------------------------
     Der Tagesmix wählt selbst aus. Wer ein bestimmtes Thema verbessern
     will, stellt sich die Runde hier zusammen. */
  function roundFor(id){
    var lv=levelOf(id);
    return lv===0?'a':(lv===1?'b':(Math.random()<0.5?'a':'b'));
  }
  function quoteOf(id){
    var p=P(id);
    return p.done? p.correct/p.done : -1;   /* -1 = noch nie geübt */
  }
  /* Schwach = schon geübt, aber Quote unter 70 %. Danach die noch
     unberührten Themen, damit die Auswahl nie leer bleibt. */
  function weakest(k){
    var geuebt=WORLDS.filter(function(w){ return quoteOf(w.id)>=0; })
      .sort(function(a,b){ return quoteOf(a.id)-quoteOf(b.id); });
    var neu=WORLDS.filter(function(w){ return quoteOf(w.id)<0; });
    return geuebt.concat(neu).slice(0,k).map(function(w){ return w.id; });
  }

  /* ---- Blitzrunde --------------------------------------------------
     60 Sekunden, nur Auswahlfragen aus allen Themen. Zählt nicht auf
     die Themenstufen ein - sonst würde Tempo den Lernstand verfälschen. */
  var BLITZ_S=60;
  function blitzPool(){
    var out=[];
    WORLDS.forEach(function(w){
      ['a','b'].forEach(function(r){
        var d=w[r];
        if(d && d.type==='choice' && d.items) d.items.forEach(function(it){ out.push({w:w,it:it}); });
      });
    });
    return shuffle(out);
  }
  function blitzStart(){
    var pool=blitzPool();
    if(!pool.length) return;
    S.blitz={ pool:pool, i:0, correct:0, wrong:0, picked:null,
              endsAt:Date.now()+BLITZ_S*1000, over:false, timer:null, hop:null };
    S.screen='blitz'; render();
    S.blitz.timer=setInterval(blitzTick,200);
  }
  function blitzTick(){
    var b=S.blitz; if(!b||b.over) return;
    var left=Math.max(0,b.endsAt-Date.now());
    var bar=document.getElementById('bzBar'), t=document.getElementById('bzTime');
    if(bar) bar.style.width=(left/(BLITZ_S*1000)*100)+'%';
    if(t) t.textContent=Math.ceil(left/1000)+' s';
    if(left<=0) blitzEnd();
  }
  function blitzEnd(){
    var b=S.blitz; if(!b||b.over) return;
    b.over=true;
    if(b.timer) clearInterval(b.timer);
    if(b.hop) clearTimeout(b.hop);
    meta.blitzBest=Math.max(meta.blitzBest|0, b.correct);
    meta.blitzRuns=(meta.blitzRuns|0)+1;
    meta.xp=(meta.xp||0)+b.correct*5;
    save(K_META,meta);
    S.screen='blitzend'; render();
  }
  function blitzAnswer(v){
    var b=S.blitz; if(!b||b.over||b.picked!=null) return;
    var cur=b.pool[b.i];
    b.picked=v;
    if(v===cur.it.correct) b.correct++; else b.wrong++;
    render();
    b.hop=setTimeout(function(){
      if(!S.blitz||S.blitz.over) return;
      b.i++; b.picked=null;
      if(b.i>=b.pool.length) b.pool=b.pool.concat(blitzPool());
      render();
    }, v===cur.it.correct?520:900);
  }
  function blitzQuit(){
    var b=S.blitz;
    if(b){ if(b.timer) clearInterval(b.timer); if(b.hop) clearTimeout(b.hop); }
    S.blitz=null; S.screen='home'; render();
  }

  /* ================= Zustand ================= */
  var S = {
    screen:'home', stop:0, item:0, phase:'intro',
    result:null, roundCorrect:0, roundTotal:0,
    sessionCorrect:0, sessionTotal:0, doneStops:[],
    scale:1, muted:false, typing:false, micMsg:null, newProf:false, delArm:false,
    pick:{}, blitz:null,
    order:{picked:[]}, match:{sel:null,done:[],wrong:0}, sort:{i:0,trace:[]}
  };

  /* ================= Sprache ================= */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  /* MIC.off = Diktieren ausblenden, weil es hier nachweislich nicht geht. */
  var MIC={ supported:!!SR, granted:false, off:!SR };
  var rec=null, listening=false;

  var MSG_BLOCK='Das Mikrofon ist gesperrt. Erlaube den Zugriff (Schloss-Symbol in der Adresszeile) und tippe dann auf „Mikrofon nochmal versuchen".';
  var MSG_NOMIC='Ich finde kein Mikrofon. Tippe deine Antwort einfach ein.';
  var MSG_QUIET='Ich habe nichts gehört. Tippe auf 🎤 und sprich bitte etwas lauter.';
  var MICERR={
    unsupported:'Dieser Browser kann nicht zuhören. Am besten klappt es in Chrome, Edge oder Safari – tippen geht überall.',
    blocked:MSG_BLOCK, 'not-allowed':MSG_BLOCK,
    'service-not-allowed':'Die Spracherkennung ist in diesem Fenster nicht erlaubt. Öffne die Seite in einem eigenen Browser-Tab – oder tippe.',
    nomic:MSG_NOMIC, 'audio-capture':MSG_NOMIC,
    nospeech:MSG_QUIET, 'no-speech':MSG_QUIET,
    network:'Die Spracherkennung ist gerade nicht erreichbar. Versuch es später nochmal oder tippe.',
    retry:'Das Mikrofon ist jetzt erlaubt. Tippe noch einmal auf 🎤.',
    needsallow:'Der Browser hat das Mikrofon noch nicht freigegeben. Tippe nochmal auf 🎤 und wähle „Zulassen".',
    embedded:'In diesem eingebetteten Fenster ist das Mikrofon gesperrt – darum fragt der Browser gar nicht erst. Öffne die Seite in einem eigenen Tab, dann kannst du sprechen.',
    aborted:'',
    err:'Das hat leider nicht geklappt. Versuch es nochmal oder tippe deine Antwort.'
  };
  /* Fehler, nach denen Sprechen dauerhaft keinen Sinn mehr hat */
  var MIC_FATAL={unsupported:1,blocked:1,'not-allowed':1,'service-not-allowed':1,nomic:1,'audio-capture':1,embedded:1};

  function speak(t,lang){
    if(S.muted||!('speechSynthesis' in window))return;
    try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang=lang||'de-DE'; u.rate=.88; speechSynthesis.speak(u);}catch(e){}
  }

  function embedded(){ try{ return window.self!==window.top; }catch(e){ return true; } }

  /* Nachträgliche Ursachensuche. Läuft ERST nach einem Fehlschlag: vorher darf
     nichts Asynchrones dazwischen, sonst ist auf iOS Safari die Nutzergeste
     verbraucht und die Erkennung startet gar nicht. */
  function diagnoseMic(code,cb){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ cb(embedded()?'embedded':code); return; }
    var p;
    try{ p=navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ cb(embedded()?'embedded':code); return; }
    p.then(function(stream){
      try{ stream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){}
      MIC.granted=true; cb('retry');
    })['catch'](function(e){
      var nm=e&&e.name;
      if(nm==='NotFoundError'||nm==='DevicesNotFoundError'||nm==='OverconstrainedError'){ cb('nomic'); return; }
      cb(embedded()?'embedded':'blocked');
    });
  }

  /* Chrome beendet die Erkennung bei gesperrtem Mikro teils ohne Fehler -
     dann sähe der Nutzer "sprich lauter", obwohl gar nichts durchkommt. */
  function probePermission(cb){
    var pm=navigator.permissions;
    if(!pm||!pm.query){ cb('nospeech'); return; }
    var qq;
    try{ qq=pm.query({name:'microphone'}); }catch(e){ cb('nospeech'); return; }
    qq.then(function(st){
      if(st.state==='denied'){ cb(embedded()?'embedded':'blocked'); return; }
      if(st.state==='granted'){ MIC.granted=true; cb('nospeech'); return; }
      cb('needsallow');
    })['catch'](function(){ cb('nospeech'); });

  /* Pro Aufnahme eine frische Instanz - eine wiederverwendete bleibt in Chrome
     regelmäßig im InvalidState hängen und startet dann nie wieder. */
  function startRec(lang,cb){
    var r;
    try{ r=new SR(); }catch(e){ cb(null,'err'); return; }
    r.continuous=false; r.interimResults=false; r.maxAlternatives=4; r.lang=lang;
    var done=false, alts=null, timer=0;
    function finish(res,err){
      if(done) return; done=true;
      haltVisual(); cb(res,err);
    }
    function haltVisual(){ clearTimeout(timer); listening=false; rec=null; paintMic(); }
    r.onresult=function(e){
      var list=[], res=e.results[0], i;
      for(i=0;i<res.length;i++){ if(res[i]&&res[i].transcript) list.push(res[i].transcript); }
      if(list.length) alts=list;
    };
    r.onerror=function(e){
      var code=(e&&e.error)||'err';
      if(code==='not-allowed'||code==='service-not-allowed'||code==='audio-capture'){
        haltVisual();
        diagnoseMic(code,function(kind){ finish(null,kind); });
        return;
      }
      finish(null,code);
    };
    r.onend=function(){
      if(alts){ MIC.granted=true; finish(alts,null); return; }
      if(MIC.granted){ finish(null,'nospeech'); return; }
      haltVisual();
      probePermission(function(kind){ finish(null,kind); });
    };
    rec=r; listening=true; paintMic();
    timer=setTimeout(function(){ try{ r.stop(); }catch(e){} },9000);
    try{ r.start(); }
    catch(e){ finish(null,/InvalidState/i.test(''+e)?'aborted':'err'); }
  }

  function esc(s){ return (s==null?'':''+s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function norm(s){ return (s||'').toLowerCase().normalize('NFKC').replace(/[„“"'’.,!?;:()]/g,'').replace(/\s+/g,' ').trim(); }

  var NUMWORDS={'null':0,'eins':1,'ein':1,'eine':1,'zwei':2,'drei':3,'vier':4,'fünf':5,'fuenf':5,'sechs':6,'sieben':7,'acht':8,'neun':9,'zehn':10,
    'elf':11,'zwölf':12,'zwoelf':12,'dreizehn':13,'vierzehn':14,'fünfzehn':15,'sechzehn':16,'siebzehn':17,'achtzehn':18,'neunzehn':19,
    'zwanzig':20,'dreißig':30,'dreissig':30,'vierzig':40,'fünfzig':50,'fuenfzig':50,'sechzig':60,'siebzig':70,'achtzig':80,'neunzig':90,'hundert':100,'tausend':1000};
  function parseNum(txt){
    if(txt==null) return null;
    var t=(''+txt).replace(',','.');
    var m=t.match(/-?\d+(\.\d+)?/);
    if(m) return parseFloat(m[0]);
    var w=norm(t).replace(/\s/g,'');
    if(NUMWORDS[w]!=null) return NUMWORDS[w];
    var mm=w.match(/^(\w+?)und(\w+?)$/);      // z.B. sechsunddreissig
    if(mm && NUMWORDS[mm[1]]!=null && NUMWORDS[mm[2]]!=null) return NUMWORDS[mm[2]]+NUMWORDS[mm[1]];
    return null;
  }
  function overlap(a,b){
    var wa=norm(a).split(' ').filter(Boolean), wb=norm(b).split(' ').filter(Boolean);

  }

  /* ================= Dateien ausgeben =================
     Im eingebetteten Fenster sind Druckdialog und direkter Download
     gesperrt. Dateien gehen deshalb über die Download-Fähigkeit der
     Seite; eigenständig gehostet greift der normale Anker-Download. */
  var DL={ns:undefined};
  function dlGet(cb){
    if(DL.ns!==undefined){ cb(DL.ns); return; }
    if(!(window.claude && typeof window.claude.use==='function')){ DL.ns=null; cb(null); return; }
    try{
      window.claude.use('downloads').then(function(ns){ DL.ns=ns||null; cb(DL.ns); })
        ['catch'](function(){ DL.ns=null; cb(null); });
    }catch(e){ DL.ns=null; cb(null); }
  }
  function anchorSave(name,data){
    try{
      var bl=(data instanceof Blob)?data:new Blob([data]);
      var url=URL.createObjectURL(bl);
      var a=document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },600);
      return true;
    }catch(e){ return false; }
  }
  /* alt = Ausweichformat, falls der Betrachter die erweiterten Dateitypen
     (pdf, csv) nicht freigeschaltet hat. */
  function offerFile(name,data,alt,say){
    say=say||function(){};
    dlGet(function(ns){
      if(!ns){ say(anchorSave(name,data)?'Gespeichert.':'Speichern ist hier nicht möglich.'); return; }
      ns.save({filename:name,data:data}).then(function(){ say('Gespeichert.'); })
      ['catch'](function(e){
        var c=e&&e.code;
        if(c==='declined'){ say(''); return; }
        if(c==='rate_limited'){ say('Ein Speichern-Dialog ist noch offen – kurz warten.'); return; }
        if(c==='extension_not_enabled' && alt){
          ns.save({filename:alt.name,data:alt.data}).then(function(){ say('Als '+alt.label+' gespeichert.'); })
          ['catch'](function(e2){
            say((e2&&e2.code)==='declined'?'':'Speichern ist hier nicht möglich – nimm die Tabelle unten.');
          });
          return;
        }
        say('Speichern ist hier nicht möglich – nimm die Tabelle unten.');
      });
    });
  }

  /* ---- Minimaler PDF-Erzeuger (Helvetica, Text + Linien) ----
     Reicht für den Lernbericht und spart eine externe Bibliothek. */
  var WINMAP={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,
    0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,
    0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,
    0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
  function winBytes(str){
    var out=[],i,c;
    for(i=0;i<str.length;i++){
      c=str.charCodeAt(i);
      if(WINMAP[c]!=null) c=WINMAP[c];
      else if(c>0xFF) c=0x3F;
      if(c===0x28||c===0x29||c===0x5C) out.push(0x5C);
      out.push(c);
    }
    return out;
  }
  function txtW(s,size,bold){ return (''+s).length*size*(bold?0.56:0.5); }
  function clipTxt(s,maxW,size,bold){
    s=''+s;
    if(txtW(s,size,bold)<=maxW) return s;
    var t=s;
    while(t.length>1 && txtW(t+'\u2026',size,bold)>maxW) t=t.slice(0,-1);
    return t+'\u2026';
  }
  function Stream(){ this.b=[]; }
  Stream.prototype.a=function(str){ for(var i=0;i<str.length;i++) this.b.push(str.charCodeAt(i)&0xFF); return this; };
  Stream.prototype.str=function(t){ this.b.push(0x28); var w=winBytes(''+t),i; for(i=0;i<w.length;i++) this.b.push(w[i]); this.b.push(0x29); return this; };
  Stream.prototype.text=function(x,y,t,size,bold,grey){
    this.a((grey==null?0:grey).toFixed(2)+' g BT /'+(bold?'F2':'F1')+' '+size+' Tf 1 0 0 1 '+x.toFixed(2)+' '+y.toFixed(2)+' Tm ');
    return this.str(t).a(' Tj ET\n');
  };
  Stream.prototype.line=function(x1,y1,x2,y2,w,grey){
    return this.a((grey==null?0.75:grey).toFixed(2)+' G '+w.toFixed(2)+' w '+x1.toFixed(2)+' '+y1.toFixed(2)+' m '+x2.toFixed(2)+' '+y2.toFixed(2)+' l S\n');
  };

  function assemblePDF(pages,W,H){
    var out=[], off=[], i;
    function put(str){ for(var k=0;k<str.length;k++) out.push(str.charCodeAt(k)&0xFF); }
    function obj(num){ off[num]=out.length; put(num+' 0 obj\n'); }
    put('%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n');
    var first=5, kids=[];
    for(i=0;i<pages.length;i++) kids.push((first+i*2)+' 0 R');
    obj(1); put('<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
    obj(2); put('<</Type/Pages/Kids['+kids.join(' ')+']/Count '+pages.length+'>>\nendobj\n');
    obj(3); put('<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>\nendobj\n');
    obj(4); put('<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>\nendobj\n');
    for(i=0;i<pages.length;i++){
      var pn=first+i*2, cn=pn+1;
      obj(pn);
      put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W.toFixed(2)+' '+H.toFixed(2)+']'+
          '/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents '+cn+' 0 R>>\nendobj\n');
      obj(cn);
      var body=pages[i].b;
      put('<</Length '+body.length+'>>\nstream\n');
      for(var k=0;k<body.length;k++) out.push(body[k]);
      put('\nendstream\nendobj\n');
    }
    var total=first+pages.length*2, xref=out.length;
    put('xref\n0 '+total+'\n0000000000 65535 f \n');
    for(i=1;i<total;i++){
      var o=off[i]||0, sO=''+o;
      while(sO.length<10) sO='0'+sO;
      put(sO+' 00000 n \n');
    }
    put('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF\n');
    return new Blob([new Uint8Array(out)],{type:'application/pdf'});
  }

  function reportPDF(){
    var W=595.28, H=841.89, M=42, y=0, pages=[], cs=null;
    var rows=reportRows();
    var totA=rows.reduce(function(a,r){return a+r.aufg;},0);
    var totC=rows.reduce(function(a,r){return a+r.richtig;},0);
    var quote= totA? Math.round(totC/totA*100):0;
    var cols=[70,168,88,46,46,46,70];               /* Summe 534 */
    var heads=['Fach','Thema','Stand','Aufgaben','Richtig','Quote','Zuletzt'];
    function newPage(){
      cs=new Stream(); pages.push(cs); y=H-M;
      cs.text(M,y,'Lernbericht',18,true,0.1); y-=16;
      cs.text(M,y,(meta.name?meta.name+'  \u00b7  ':'')+'Stand '+fmtDate(new Date().toISOString()),9,false,0.4);
      y-=18; cs.line(M,y,W-M,y,1,0.6); y-=18;
    }
    function tableHead(){
      var x=M,i;
      for(i=0;i<heads.length;i++){ cs.text(x,y,heads[i],8,true,0.35); x+=cols[i]; }
      y-=6; cs.line(M,y,W-M,y,0.6,0.75); y-=12;
    }
    function room(need){ if(y-need<M){ newPage(); tableHead(); } }
    newPage();
    cs.text(M,y,'Aufgaben bearbeitet: '+totA+'    davon richtig: '+totC+'    Trefferquote: '+quote+'%',10,true,0.15);
    y-=22;
    tableHead();
    rows.forEach(function(r){
      room(14);
      var stand = r.stufe>=2?'gemeistert':(r.stufe>=1?'begonnen':'offen');
      var cells=[r.fach,r.thema,stand,''+r.aufg,''+r.richtig,(r.aufg?r.quote+'%':'\u2013'),fmtDate(r.last)];
      var x=M,i;
      for(i=0;i<cells.length;i++){ cs.text(x,y,clipTxt(cells[i],cols[i]-6,9,false),9,false,0.15); x+=cols[i]; }
      y-=6; cs.line(M,y,W-M,y,0.4,0.88); y-=10;
    });
    if(log.length){
      room(50); y-=12;
      cs.text(M,y,'Letzte \u00dcbungsrunden',12,true,0.1); y-=16;
      var lh=['Datum','Thema','Runde','Ergebnis'], lc=[80,240,60,80], x2=M,j;
      for(j=0;j<lh.length;j++){ cs.text(x2,y,lh[j],8,true,0.35); x2+=lc[j]; }
      y-=6; cs.line(M,y,W-M,y,0.6,0.75); y-=12;
      log.slice(-15).reverse().forEach(function(L){
        room(14);
        var w=WORLDS.filter(function(x){return x.id===L.w;})[0];
        var cells=[fmtDate(L.d), w?w.title:L.w, (L.r==='a'?'1':'2'), L.c+' / '+L.t];
        var x=M,i;
        for(i=0;i<cells.length;i++){ cs.text(x,y,clipTxt(cells[i],lc[i]-6,9,false),9,false,0.15); x+=lc[i]; }
        y-=6; cs.line(M,y,W-M,y,0.4,0.88); y-=10;
      });
    }
    return assemblePDF(pages,W,H);
  }

  function reportMarkdown(){

      L.push('| '+r.fach+' | '+r.thema+' | '+stand+' | '+r.aufg+' | '+r.richtig+' | '+(r.aufg?r.quote+'%':'\u2013')+' | '+fmtDate(r.last)+' |');

  function buildCSV(){
    var sep=';';
    var head=['Fach','Thema','Stand','Aufgaben','Richtig','Quote %','Zuletzt geuebt'];
    var lines=[head.join(sep)];
    reportRows().forEach(function(r){
      var stand=r.stufe>=2?'gemeistert':(r.stufe>=1?'begonnen':'offen');
      lines.push([r.fach,r.thema,stand,r.aufg,r.richtig,(r.aufg?r.quote:''),fmtDate(r.last)].join(sep));
    });
    lines.push('');
    lines.push(['Datum','Thema','Runde','Richtig','Gesamt'].join(sep));
    log.forEach(function(L){
      var w=WORLDS.filter(function(x){return x.id===L.w;})[0];
      lines.push([fmtDate(L.d),(w?w.title:L.w),(L.r==='a'?1:2),L.c,L.t].join(sep));
    });
    return lines.join('\n');
  }

  function vOrder(){
    var st=stop(), d=st.def, it=item(), st2=S.order;
    var sol=it.solution, done=st2.picked.length>=sol.length;
    // Reihenfolge einmal mischen und merken - sonst stünde die Lösung schon da
    if(!st2.shuffled || st2.forItem!==S.item){
      var mix=shuffle(sol);
      if(sol.length>1 && mix.join('|')===sol.join('|')) mix=shuffle(sol);
      st2.shuffled=mix; st2.forItem=S.item;
    }
    var h=head()+'<p class="hint">'+esc(d.prompt)+'</p>';
    h+='<div class="slot">'+(st2.picked.length? st2.picked.map(esc).join(' ') : '<span class="hint">Noch nichts gewählt</span>')+'</div>';
    h+='<div class="chips">';
    var counts={};
    st2.picked.forEach(function(p){ counts[p]=(counts[p]||0)+1; });
    var seen={};
    st2.shuffled.forEach(function(w){
      seen[w]=(seen[w]||0)+1;
      var isUsed = seen[w] <= (counts[w]||0);
      h+='<button class="chip" data-a="ord" data-v="'+esc(w)+'"'+(isUsed?' disabled':'')+'>'+esc(w)+'</button>';
    });
    h+='</div>';
    if(st2.msg) h+='<div class="fb no">'+esc(st2.msg)+'</div>';
    if(done) h+='<div class="fb ok">⭐ '+kudos()+'</div>';
    var lastOrd = (S.stop===PLAN.length-1) && (S.item>=items().length-1);
    h+='<div class="row"><span class="sp"></span>'+
       (done?'':'<button class="btn g" data-a="ordreset">Nochmal</button>')+
       (done?'':'<button class="btn g" data-a="skip">Überspringen</button>')+
       '<button class="btn p" data-a="next">'+(lastOrd?'Fertig 🎉':'Weiter →')+'</button></div>';
    return h;
  }

  function recordAnswer(ok){
    S.roundTotal++; S.sessionTotal++;
    if(ok){ S.roundCorrect++; S.sessionCorrect++; }
  }

  function finishStop(){
    var st=stop(), w=st.world, p=P(w.id);
    p.done += S.roundTotal; p.correct += S.roundCorrect; p.last=new Date().toISOString();
    var q = S.roundTotal? S.roundCorrect/S.roundTotal : 0;
    var passed = q>=0.6;
    var newBadge=false;
    if(passed && !st.review){
      if(st.round==='a' && p.level<1){ p.level=1; newBadge=true; }
      else if(st.round==='b' && p.level<2){ p.level=2; newBadge=true; }
    }
    p.stars=Math.max(p.stars||0, q>=0.9?3:(q>=0.7?2:1));
    prog[w.id]=p; save(K_PROG,prog);
    log.push({d:new Date().toISOString(), w:w.id, r:st.round, c:S.roundCorrect, t:S.roundTotal});
    if(log.length>200) log=log.slice(-200);
    save(K_LOG,log);
    S.doneStops.push({id:w.id, newBadge:newBadge});
    S.gainXP=(S.gainXP||0)+S.roundCorrect*10+(passed?25:0);
    S.roundCorrect=0; S.roundTotal=0;
  }

  function nextStop(){
    finishStop();
    if(S.stop<PLAN.length-1){
      S.stop++; S.item=0; S.phase='intro'; S.result=null; S.typing=false; S.micMsg=null; stopListening();
      S.order={picked:[]}; S.match={sel:null,done:[],wrong:0}; S.sort={i:0,trace:[]};
      render();
    }else{
      meta.xp=(meta.xp||0)+(S.gainXP||0); save(K_META,meta);
      S.screen='finish'; render();
      cloudSave(function(){ paintCloudLine(); });
    }
  }

  function advance(){
    var d=stop().def;
    if(d.type==='story' && S.phase==='intro'){ S.phase='q'; S.item=0; S.result=null; render(); return; }
    if(d.type==='order' && S.item<items().length-1){
      S.item++; S.order={picked:[]}; render(); return;
    }
    if((d.type==='choice'||d.type==='story'||d.type==='input') && S.item<items().length-1){
      S.item++; S.result=null; S.typing=false; S.micMsg=null; stopListening(); render(); return;
    }
    nextStop();
  }

  /* ================= Eingaben prüfen ================= */
  /* said = getippter Text ODER Liste der Erkennungs-Varianten aus dem Mikrofon.
     Die Spracherkennung liegt oft erst bei Variante 2 oder 3 richtig. */
  function checkInput(said){
    var st=stop(), d=st.def, it=item();
    var alts = Object.prototype.toString.call(said)==='[object Array]' ? said : [said];
    var shown = (alts.length&&alts[0]!=null) ? ''+alts[0] : '';
    var ok=false, solution, i;
    if(d.numeric){
      solution=''+it.answer;
      for(i=0;i<alts.length;i++){
        var v=parseNum(alts[i]);
        if(v!==null && Math.abs(v-it.answer)<1e-9){ ok=true; shown=''+alts[i]; break; }
      }
    }else{
      var acc=it.accepts||[]; solution=acc[0]||'';
      for(i=0;i<alts.length && !ok;i++){
        var sd=''+(alts[i]||'');
        ok = acc.some(function(a){ return norm(sd)===norm(a) || overlap(a,sd)>=0.7; });
        if(ok) shown=sd;
      }
    }
    S.micMsg=null;
    S.result={said:shown, ok:ok, solution:solution};
    recordAnswer(ok);
    render();
  }

  /* ================= Ereignisse ================= */
  var lastClick=0;
  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-a],#go,#again,#toColl,#toRep,#back,#pr,#pdf,#csv,#cloud,#stExp,#stImp,#stCode,#stRead,#doRen,#doDel,#doDelNo,#avPick,#avDrop,#toPick,#toBlitz,#nmMic,#bPlus,#bMinus,#bSound,#bTheme');
    if(!t) return;
    var now=Date.now(); if(now-lastClick<220) return; lastClick=now;

    if(t.id==='bPlus'){ S.scale=Math.min(1.4,+(S.scale+0.1).toFixed(2)); render(); return; }
    if(t.id==='bMinus'){ S.scale=Math.max(.85,+(S.scale-0.1).toFixed(2)); render(); return; }
    if(t.id==='bSound'){ S.muted=!S.muted; if(S.muted&&window.speechSynthesis) speechSynthesis.cancel(); render(); return; }
    if(t.id==='bTheme'){
      var c=document.documentElement.getAttribute('data-theme');
      var n=c==='dark'?'light':(c==='light'?null:'dark');
      if(n) document.documentElement.setAttribute('data-theme',n); else document.documentElement.removeAttribute('data-theme');
      return;
    }
    if(t.id==='nmMic'){
      if(listening){ stopListening(); return; }
      var nh=document.getElementById('nmHint');
      if(nh) nh.textContent='🎧 Ich höre zu …';
      listen('de-DE',function(x,err){
        if(err){ if(MIC_FATAL[err]) MIC.off=true; if(nh) nh.textContent=MICERR[err]||MICERR.err; return; }
        var i=document.getElementById('newnm')||document.getElementById('renm');
        if(i&&x&&x.length) i.value=(''+x[0]).replace(/[.,!?]+$/,'');
        if(nh) nh.textContent='';
      });
      return;
    }
    if(t.id==='go'){
      touchStreak();
      S.screen='play'; S.stop=0; S.item=0; S.phase='intro'; S.result=null;
      S.sessionCorrect=0; S.sessionTotal=0; S.roundCorrect=0; S.roundTotal=0; S.gainXP=0; S.doneStops=[];
      render(); return;
    }
    if(t.id==='again'){ location.reload(); return; }
    if(t.id==='toPick'){ S.back=S.screen; S.screen='pick'; render(); return; }
    if(t.id==='toBlitz'){ blitzStart(); return; }
    if(t.id==='toColl'){ S.back=S.screen; S.screen='coll'; render(); return; }
    if(t.id==='toRep'){ S.back=S.screen; S.screen='rep'; S.delArm=false; render(); return; }
    if(t.id==='back'){ S.pick={}; S.screen=S.back==='finish'?'finish':'home'; render(); return; }
    if(t.id==='cloud'){
      t.disabled=true; paintCloudLine('☁ Wird gesichert …');
      cloudSave(function(){ t.disabled=false; paintCloudLine(); });
      return;
    }
    if(t.id==='avPick'){
      var af=document.getElementById('avFile');
      if(af) af.click(); else paintPfLine('Dateiauswahl geht hier nicht.');
      return;
    }
    if(t.id==='avDrop'){
      setAvatar(store.active,AVATARS[Math.floor(Math.random()*AVATARS.length)]);
      render(); paintPfLine('Foto entfernt.');
      return;
    }
    if(t.id==='doRen'){
      var ri=document.getElementById('renm');
      var err=renameProfile(store.active, ri?ri.value:'');
      if(err){ paintPfLine(err); return; }
      rebuildPlan(); render(); paintPfLine('Umbenannt.');
      return;
    }
    if(t.id==='doDel'){
      if(!S.delArm){ S.delArm=true; render(); paintPfLine('Der Lernstand von '+store.active+' wird gelöscht. Das lässt sich nicht rückgängig machen.'); return; }
      var weg=store.active;
      deleteProfile(weg); S.delArm=false;
      rebuildPlan(); render(); paintPfLine('Lernstand von '+weg+' gelöscht.');
      return;
    }
    if(t.id==='doDelNo'){ S.delArm=false; render(); return; }
    if(t.id==='stExp'){
      offerFile('Lernstand.json', exportState(null,true), null, function(m){ paintStLine(m); });
      return;
    }
    if(t.id==='stImp'){
      var f=document.getElementById('stFile');
      if(f) f.click(); else paintStLine('Datei-Auswahl geht hier nicht – nimm den Code.');
      return;
    }
    if(t.id==='stCode'){
      var box=document.getElementById('stBox');
      if(box) box.innerHTML='<p class="hint">Diesen Text kopieren, auf dem anderen Gerät hier einfügen und auf „Einlesen" tippen.</p>'+
        '<textarea id="stTa">'+esc(exportState())+'</textarea>'+
        '<div class="row"><button class="btn p" id="stRead">Einlesen</button></div>';
      paintStLine('');
      return;
    }
    if(t.id==='stRead'){
      var ta=document.getElementById('stTa');
      var err=importState(ta?ta.value:'');
      if(err){ paintStLine(err); return; }
      render(); paintStLine('Lernstand übernommen und zusammengeführt.');
      return;
    }
    if(t.id==='pr'){ window.print(); return; }
    if(t.id==='pdf'){
      t.disabled=true; paintDlLine('PDF wird erstellt \u2026');
      var blob;
      try{ blob=reportPDF(); }
      catch(e){ t.disabled=false; paintDlLine('Das PDF konnte nicht erzeugt werden.'); return; }
      offerFile('Lernbericht.pdf', blob,
        {name:'Lernbericht.md', data:reportMarkdown(), label:'Markdown-Datei'},
        function(m){ t.disabled=false; paintDlLine(m); });
      return;
    }
    if(t.id==='csv'){
      var csv='\ufeff'+buildCSV();
      var box=document.getElementById('csvbox');
      offerFile('Lernbericht.csv', csv,
        {name:'Lernbericht.txt', data:csv, label:'Textdatei'},
        function(m){ paintDlLine(m); });
      if(box) box.innerHTML='<p class="hint">Zum Weiterverarbeiten kannst du den Text hier auch markieren und in Excel einfügen.</p><textarea readonly>'+esc(csv)+'</textarea>';
      return;
    }

    var a=t.getAttribute('data-a');
    if(!a) return;
    var st=stop();

    if(a==='pt'){
      var pid=t.getAttribute('data-v');
      if(S.pick[pid]) delete S.pick[pid]; else S.pick[pid]=true;
      render(); return;
    }
    if(a==='pickweak'){
      S.pick={}; weakest(3).forEach(function(id){ S.pick[id]=true; });
      render(); return;
    }
    if(a==='pickclear'){ S.pick={}; render(); return; }
    if(a==='pickgo'){
      var ids=Object.keys(S.pick).filter(function(k){ return S.pick[k]; });
      if(!ids.length) return;
      S.pick={}; startTopics(ids); return;
    }
    if(a==='bz'){ blitzAnswer(t.getAttribute('data-v')); return; }
    if(a==='bzquit'){ blitzQuit(); return; }
    if(a==='bzagain'){ blitzStart(); return; }
    if(a==='bzhome'){ S.blitz=null; S.screen='home'; render(); return; }
    if(a==='av'){
      var err=setAvatar(store.active,t.getAttribute('data-v'));
      render(); paintPfLine(err||'');
      return;
    }
    if(a==='prof'){
      var nm=t.getAttribute('data-v');
      if(nm!==store.active){ useProfile(nm); rebuildPlan(); }
      S.newProf=false; render(); return;
    }
    if(a==='profnew'){ S.newProf=true; render();
      var ni=document.getElementById('newnm'); if(ni) ni.focus(); return; }
    if(a==='profcancel'){ S.newProf=false; render(); return; }
    if(a==='profsave'){
      var inp=document.getElementById('newnm');
      var nn=inp?inp.value.trim():'';
      var hint=document.getElementById('nmHint');
      if(!nn){ if(hint) hint.textContent='Bitte einen Namen eingeben.'; return; }
      if(store.profiles[nn]){ if(hint) hint.textContent='Dieses Kind gibt es schon.'; return; }
      useProfile(nn); S.newProf=false; rebuildPlan(); render(); return;
    }
    if(a==='say'){ speak(t.getAttribute('data-t')||'', langOf(st.world)); return; }
    if(a==='start'){ S.phase='q'; S.item=0; S.result=null; render(); return; }

    if(a==='pick'){
      if(S.result) return;
      var v=t.getAttribute('data-v');
      S.result={picked:v};
      recordAnswer(v===item().correct);
      render(); return;
    }
    if(a==='mic'){
      if(listening){ stopListening(); return; }
      showMicMsg(null);
      listen(t.getAttribute('data-lang')||'de-DE',function(x,err){
        if(err){
          if(MIC_FATAL[err]){ MIC.off=true; S.typing=true; S.micMsg=MICERR[err]||MICERR.err; render(); }
          else showMicMsg(MICERR[err]!==undefined?MICERR[err]:MICERR.err);
          return;
        }
        checkInput(x);
      });
      return; /* bewusst kein render(): sonst wird die Aufnahme-Anzeige sofort weggezeichnet */
    }
    if(a==='type'){ stopListening(); S.typing=true; S.micMsg=null; render(); return; }
    if(a==='mic2'){ S.typing=false; MIC.off=false; S.micMsg=null; render(); return; }
    if(a==='sub'){
      var inp=document.getElementById('tin');
      checkInput(inp?inp.value:'');
      return;
    }

    if(a==='ord'){
      var w=t.getAttribute('data-v');
      var sol=item().solution, k=S.order.picked.length;
      if(sol[k]===w){ S.order.picked.push(w); S.order.msg=null;
        if(S.order.picked.length===sol.length){ recordAnswer(true); }
      } else { S.order.msg='Das passt hier noch nicht – probier ein anderes.'; }
      render(); return;
    }
    if(a==='ordreset'){ S.order={picked:[]}; render(); return; }

    if(a==='ml'){ S.match.sel=parseInt(t.getAttribute('data-i'),10); S.match.msg=null; render(); return; }
    if(a==='mr'){
      var m=S.match;
      if(m.sel==null){ m.msg='Wähle zuerst links etwas aus.'; render(); return; }
      var pairs=stop().def.pairs, r=t.getAttribute('data-r');
      if(pairs[m.sel].r===r){ m.done.push(m.sel); m.sel=null; m.msg=null; recordAnswer(true);
        if(m.done.length>=pairs.length){ /* fertig */ }
      } else { m.msg='Das passt nicht zusammen – schau nochmal.'; m.sel=null; recordAnswer(false); }
      render(); return;
    }

    if(a==='srt'){
      var d=stop().def, s=S.sort, it=d.items[s.i];
      if(!it) return;
      var chose = t.getAttribute('data-v')==='a';
      var ok = chose===it.a;
      s.trace.push({label:(it.show||it.text), ok:ok});
      s.msg = ok?null:('Richtig wäre: '+(it.a?d.bucketA:d.bucketB)+(it.show?' ('+it.show+')':''));
      recordAnswer(ok);
      s.i++;
      render(); return;
    }

    if(a==='next'){ advance(); return; }
    if(a==='skip'){
      var d2=stop().def;
      if(d2.type==='choice'||d2.type==='story'||d2.type==='input'){ recordAnswer(false); }
      else if(d2.type==='order' && S.order.picked.length<item().solution.length){ recordAnswer(false); }
      advance(); return;
    }
  });

  document.addEventListener('change',function(ev){
    var t=ev.target;
    if(t && t.id==='avFile' && t.files && t.files[0]){
      paintPfLine('Bild wird verkleinert …');
      processAvatar(t.files[0],function(dataUrl,err){
        if(err){ paintPfLine(err); return; }
        var e2=setAvatar(store.active,dataUrl);
        render(); paintPfLine(e2||'Foto gespeichert.');
      });
      t.value=''; return;
    }
    if(!t || t.id!=='stFile' || !t.files || !t.files[0]) return;
    var fr=new FileReader();
    fr.onload=function(){
      var err=importState(fr.result);
      if(err){ paintStLine(err); return; }
      render(); paintStLine('Lernstand übernommen und zusammengeführt.');
    };
    fr.onerror=function(){ paintStLine('Die Datei konnte nicht gelesen werden.'); };
    fr.readAsText(t.files[0]);
    t.value='';
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      var i=document.getElementById('tin');
      if(i && document.activeElement===i){ checkInput(i.value); }
    }
  });

  function paintPfLine(txt){
    var el=document.getElementById('pfLine');
    if(el) el.textContent=txt||'';
  }

  function paintStLine(txt){
    var el=document.getElementById('stLine');
    if(el) el.textContent=txt||'';
  }

  function paintDlLine(txt){
    var el=document.getElementById('dlLine');
    if(el){ el.textContent=txt||''; }
  }

  function paintCloudLine(txt){
    var el=document.getElementById('cloudLine');
    if(el) el.textContent = txt || cloudLabel();
  }

  render();
  /* Erst zeichnen, dann den geräteübergreifenden Stand nachladen: die App
     ist sofort da und aktualisiert sich, sobald die Daten eintreffen. */
  cloudInit(function(){
    if(S.screen==='home'){ rebuildPlan(); render(); }
    else paintCloudLine();
  });
})();

</script>
</body>
</html>
