name: Kalender bauen

# Baut alle Kalender (kalender/*.py -> kalender/out/*.ics) neu, sobald
# sich unter kalender/ etwas ändert, und committet die .ics-Dateien.
# Abonnierte Kalender holen sich die neue Version dann von selbst.

on:
  push:
    branches: [main]
    paths:
      - "kalender/**"
      - "!kalender/out/**"
      - ".github/workflows/kalender.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyYAML installieren
        run: pip install pyyaml

      - name: Kalender bauen
        run: |
          for skript in kalender/*.py; do
            echo "== $skript"
            python3 "$skript"
          done

      - name: Geänderte .ics committen
        run: |
          git add kalender/out/*.ics
          # DTSTAMP ändert sich bei jedem Lauf; nur committen, wenn sich
          # mehr als der Zeitstempel geändert hat.
          if git diff --cached -U0 -- kalender/out | grep -E '^[+-][^+-]' | grep -vqE '^[+-]DTSTAMP:'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Kalender neu gebaut"
            git push
          else
            echo "Keine inhaltlichen Änderungen."
          fi
